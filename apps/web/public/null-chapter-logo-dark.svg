<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <defs>
    <linearGradient id="nc-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nc-grad-dark-rev" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <filter id="nc-glow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer ring with gradient -->
  <circle cx="36" cy="36" r="33" stroke="url(#nc-grad-dark)" stroke-width="2.5" fill="none" filter="url(#nc-glow-dark)" />
  <!-- Inner subtle ring -->
  <circle cx="36" cy="36" r="27" stroke="#00D4FF" stroke-width="0.5" fill="none" opacity="0.2" />
  <!-- Brackets in circle -->
  <text x="36" y="42" font-family="'Fira Code', 'JetBrains Mono', 'SF Mono', monospace" font-size="18" font-weight="700" fill="url(#nc-grad-dark)" text-anchor="middle" letter-spacing="-1">{n_}</text>
  <!-- Main wordmark -->
  <text x="82" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#E5E7EB" letter-spacing="-0.5">null</text>
  <text x="140" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="300" fill="#6B7280" letter-spacing="-0.5">chapter</text>
  <!-- Subtitle -->
  <text x="82" y="52" font-family="'Fira Code', 'JetBrains Mono', 'SF Mono', monospace" font-size="10" font-weight="400" fill="#6B7280" letter-spacing="3" text-transform="uppercase">SCHEDULING PLATFORM</text>
</svg>
