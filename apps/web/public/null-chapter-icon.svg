<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" fill="none">
  <defs>
    <linearGradient id="nc-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    <filter id="nc-icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="36" cy="36" r="34" fill="#0A0E17" />
  <!-- Outer ring with gradient -->
  <circle cx="36" cy="36" r="33" stroke="url(#nc-icon-grad)" stroke-width="2" fill="none" filter="url(#nc-icon-glow)" />
  <!-- Inner subtle ring -->
  <circle cx="36" cy="36" r="26" stroke="#00D4FF" stroke-width="0.5" fill="none" opacity="0.2" />
  <!-- Brackets in circle -->
  <text x="36" y="42" font-family="'Fira Code', 'JetBrains Mono', 'SF Mono', monospace" font-size="20" font-weight="700" fill="url(#nc-icon-grad)" text-anchor="middle" letter-spacing="-1">{n_}</text>
</svg>
